<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>movement manual</title>
  <meta name="description" content="a searchable pilates exercise repository with 91 exercises, filterable by goals, muscle groups, and contraindications">
  <meta property="og:title" content="movement manual">
  <meta property="og:description" content="a searchable pilates exercise repository with 91 exercises">
  <meta property="og:image" content="https://bensonperry.com/movementmanual/og-image.png">
  <meta property="og:url" content="https://bensonperry.com/movementmanual">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://bensonperry.com/shared/common.css">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <div class="container">
    <header>
      <h1>movement manual</h1>
      <p class="subtitle">pilates exercise repository</p>
      <button type="button" id="theme-toggle" class="theme-toggle">
        <span class="theme-icon">☽</span> dark
      </button>
      <div class="mode-toggle">
        <button type="button" class="mode-btn active" data-mode="mat">mat</button>
        <button type="button" class="mode-btn" data-mode="reformer">reformer</button>
      </div>
    </header>

    <!-- Mobile sticky bar -->
    <div id="mobile-sticky" class="mobile-sticky">
      <div class="mobile-sticky-row">
        <div class="mobile-search">
          <input type="text" id="mobile-search-input" placeholder="search..." autocomplete="off">
        </div>
        <button type="button" id="mobile-filter-toggle" class="mobile-filter-btn">
          filters <span id="mobile-filter-count"></span>
        </button>
      </div>
      <div id="mobile-filters-expanded" class="mobile-filters-expanded hidden"></div>
    </div>

    <div class="controls-row">
      <div class="filters">
        <div class="filter-group">
          <label>search</label>
          <div class="autocomplete-wrapper">
            <input type="text" id="exercise-search" placeholder="type to search..." autocomplete="off">
            <div id="search-dropdown" class="autocomplete-dropdown hidden"></div>
          </div>
        </div>

        <div class="filter-group">
          <label>goals</label>
          <div class="multi-select-wrapper">
            <button type="button" id="goals-toggle" class="multi-select-toggle">
              <span id="goals-label">none selected</span>
            </button>
            <div id="goals-dropdown" class="multi-select-dropdown hidden">
              <div id="goals-options"></div>
            </div>
          </div>
        </div>

        <div class="filter-group">
          <label>muscle group</label>
          <div class="multi-select-wrapper">
            <button type="button" id="muscles-toggle" class="multi-select-toggle">
              <span id="muscles-label">none selected</span>
            </button>
            <div id="muscles-dropdown" class="multi-select-dropdown hidden">
              <div id="muscles-options"></div>
            </div>
          </div>
        </div>

        <div class="filter-group">
          <label>starting position</label>
          <select id="filter-position">
            <option value="">all positions</option>
          </select>
        </div>

        <div class="filter-group reformer-only hidden" id="orientation-group">
          <label>orientation</label>
          <select id="filter-orientation">
            <option value="">all orientations</option>
          </select>
        </div>

        <div class="filter-group reformer-only hidden" id="spring-color-group">
          <label>spring colors</label>
          <div class="spring-color-toggles">
            <button type="button" class="spring-toggle" data-color="R"><span class="spring-dot red"></span> red</button>
            <button type="button" class="spring-toggle" data-color="Y"><span class="spring-dot yellow"></span> yellow</button>
            <button type="button" class="spring-toggle" data-color="B"><span class="spring-dot blue"></span> blue</button>
          </div>
        </div>

        <div class="filter-group reformer-only hidden" id="spring-combo-group">
          <label>spring combo</label>
          <div class="multi-select-wrapper">
            <button type="button" id="spring-combo-toggle" class="multi-select-toggle">
              <span id="spring-combo-label">none selected</span>
            </button>
            <div id="spring-combo-dropdown" class="multi-select-dropdown hidden">
              <div id="spring-combo-options"></div>
            </div>
          </div>
        </div>

        <div class="filter-group">
          <label>exclude contraindications</label>
          <div class="multi-select-wrapper">
            <button type="button" id="contra-toggle" class="multi-select-toggle">
              <span id="contra-label">none selected</span>
            </button>
            <div id="contra-dropdown" class="multi-select-dropdown hidden">
              <div id="contra-options"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="view-toggle">
        <label>view</label>
        <div class="toggle-group">
          <button type="button" class="toggle-btn active" data-view="grid">grid</button>
          <button type="button" class="toggle-btn" data-view="list">list</button>
        </div>
      </div>
    </div>

    <div id="browse-count" class="result-count"></div>
    <div id="list-header" class="list-header hidden">
      <span class="list-header-name">exercise</span>
      <span class="list-header-goals">goals</span>
    </div>
    <div id="browse-grid" class="exercise-grid"></div>

    <!-- Shared: Exercise Modal/Detail View for Browse mode -->
    <div id="exercise-modal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <button class="modal-close">&times;</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <footer>made by <a href="https://bensonperry.com">benson</a></footer>

  <script src="app.js?v=8"></script>
</body>
</html>
