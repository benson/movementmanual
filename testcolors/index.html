<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spring dot styles</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Times New Roman", Times, Georgia, serif;
      background: #f8f7f4;
      color: #000;
      padding: 40px 30px 80px;
      text-transform: lowercase;
    }
    h1 { font-size: 1.3rem; font-weight: 400; margin-bottom: 6px; }
    .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 40px; }
    h2 { font-size: 0.95rem; font-weight: 400; margin-bottom: 16px; margin-top: 40px; }
    h2:first-of-type { margin-top: 0; }

    .variant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-bottom: 48px;
    }
    .variant-card {
      border: 1px solid #eee;
      border-radius: 4px;
      overflow: hidden;
    }
    .variant-label {
      padding: 10px 12px;
      font-size: 0.75rem;
      color: #666;
      border-bottom: 1px solid #eee;
    }
    .variant-samples {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sample-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sample-label {
      font-size: 0.7rem;
      color: #999;
      width: 90px;
      flex-shrink: 0;
    }
    .sample-img {
      position: relative;
      width: 120px;
      height: 90px;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sample-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* base dot container */
    .dots {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      align-items: center;
    }
    .dot {
      display: inline-block;
      border-radius: 50%;
    }
    .dot.r { background: #e74c3c; }
    .dot.y { background: #f1c40f; }
    .dot.b { background: #3498db; }
    .sep {
      font-size: 0.5rem;
      line-height: 1;
    }

    /* ====== playground ====== */
    .playground {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid #ddd;
    }
    .playground-grid {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 32px;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .control-group label {
      display: block;
      font-size: 0.7rem;
      color: #999;
      margin-bottom: 4px;
    }
    .control-group input[type="range"] {
      width: 100%;
    }
    .control-group input[type="color"] {
      border: 1px solid #ddd;
      background: none;
      width: 40px;
      height: 28px;
      cursor: pointer;
    }
    .control-row {
      display: flex;
      gap: 16px;
      align-items: flex-end;
    }
    .control-row .control-group { flex: 1; }
    .val { font-size: 0.7rem; color: #666; float: right; }
    .preview-area {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .preview-card {
      position: relative;
      width: 220px;
      height: 165px;
      border-radius: 4px;
      overflow: hidden;
    }
    .preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preview-dots {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      align-items: center;
    }
    .preview-dot {
      display: inline-block;
      border-radius: 50%;
    }
    .preview-dot.r { background: #e74c3c; }
    .preview-dot.y { background: #f1c40f; }
    .preview-dot.b { background: #3498db; }
    .preview-sep {
      line-height: 1;
    }
    .css-output {
      margin-top: 12px;
      padding: 12px;
      background: #edecea;
      font-family: monospace;
      font-size: 0.75rem;
      white-space: pre-wrap;
      border-radius: 4px;
      text-transform: none;
    }

    @media (max-width: 700px) {
      .playground-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1>spring dot style explorer</h1>
  <p class="subtitle">compare styles on actual exercise thumbnails</p>

  <div id="variants"></div>

  <div class="playground">
    <h2>playground — build your own</h2>
    <div class="playground-grid">
      <div class="controls">
        <div class="control-group">
          <label>dot size <span class="val" id="v-size">7</span>px</label>
          <input type="range" id="c-size" min="4" max="14" value="7" step="1">
        </div>
        <div class="control-group">
          <label>gap / overlap <span class="val" id="v-gap">2</span>px</label>
          <input type="range" id="c-gap" min="-8" max="6" value="2" step="1">
        </div>
        <div class="control-group">
          <label>border width <span class="val" id="v-border">0</span>px</label>
          <input type="range" id="c-border" min="0" max="4" value="0" step="0.5">
        </div>
        <div class="control-row">
          <div class="control-group">
            <label>border color</label>
            <input type="color" id="c-border-color" value="#ffffff">
          </div>
          <div class="control-group">
            <label>sep color</label>
            <input type="color" id="c-sep-color" value="#ffffff">
          </div>
        </div>
        <div class="control-group">
          <label>sep opacity <span class="val" id="v-sep-opacity">0.6</span></label>
          <input type="range" id="c-sep-opacity" min="0" max="1" value="0.6" step="0.1">
        </div>
        <div class="control-group">
          <label>background opacity <span class="val" id="v-bg">0.5</span></label>
          <input type="range" id="c-bg" min="0" max="1" value="0.5" step="0.05">
        </div>
        <div class="control-group">
          <label>background padding <span class="val" id="v-pad">3</span>px</label>
          <input type="range" id="c-pad" min="0" max="8" value="3" step="1">
        </div>
        <div class="control-group">
          <label>background radius <span class="val" id="v-radius">3</span>px</label>
          <input type="range" id="c-radius" min="0" max="16" value="3" step="1">
        </div>
        <div class="control-row">
          <div class="control-group">
            <label>red</label>
            <input type="color" id="c-red" value="#e74c3c">
          </div>
          <div class="control-group">
            <label>yellow</label>
            <input type="color" id="c-yellow" value="#f1c40f">
          </div>
          <div class="control-group">
            <label>blue</label>
            <input type="color" id="c-blue" value="#3498db">
          </div>
        </div>

        <div class="css-output" id="css-output"></div>
      </div>
      <div class="preview-area" id="preview-area"></div>
    </div>
  </div>

  <script>
    const COMBOS = [
      { label: 'Y - R', left: ['Y'], right: ['R'] },
      { label: 'B - RY', left: ['B'], right: ['R','Y'] },
      { label: 'RY - 3R', left: ['R','Y'], right: ['R','R','R'] },
      { label: '2RY - 3RBY', left: ['R','R','Y'], right: ['R','R','R','B','Y'] },
      { label: 'Y - B', left: ['Y'], right: ['B'] },
    ];

    const IMAGES = [
      '../reformer-images/page008-img1.jpeg',
      '../reformer-images/page027-img1.jpeg',
      '../reformer-images/page055-img1.jpeg',
      '../reformer-images/page081-img1.jpeg',
    ];

    const VARIANTS = [
      {
        name: 'current — spaced, no border',
        style: { size: 7, gap: 2, border: 0, borderColor: '#fff', bg: 0.5, pad: 3, radius: 3, sepColor: '#fff', sepOpacity: 0.6 }
      },
      {
        name: '1. white border, spaced',
        style: { size: 7, gap: 2, border: 1.5, borderColor: '#ffffff', bg: 0.5, pad: 3, radius: 3, sepColor: '#fff', sepOpacity: 0.6 }
      },
      {
        name: '2. white border, touching',
        style: { size: 8, gap: 0, border: 1.5, borderColor: '#ffffff', bg: 0.45, pad: 3, radius: 3, sepColor: '#fff', sepOpacity: 0.6 }
      },
      {
        name: '3. white border, overlapping',
        style: { size: 9, gap: -3, border: 1.5, borderColor: '#ffffff', bg: 0, pad: 0, radius: 0, sepColor: '#fff', sepOpacity: 0.7 }
      },
      {
        name: '4. dark border, overlapping',
        style: { size: 9, gap: -3, border: 1.5, borderColor: '#1a1a1a', bg: 0, pad: 0, radius: 0, sepColor: '#ccc', sepOpacity: 0.8 }
      },
      {
        name: '5. white border, overlapping, on pill',
        style: { size: 9, gap: -3, border: 1.5, borderColor: '#ffffff', bg: 0.5, pad: 4, radius: 12, sepColor: '#fff', sepOpacity: 0.7 }
      },
      {
        name: '6. no border, overlapping, no bg',
        style: { size: 9, gap: -3, border: 0, borderColor: '#fff', bg: 0, pad: 0, radius: 0, sepColor: '#ddd', sepOpacity: 0.8 }
      },
      {
        name: '7. large, white border, overlapping',
        style: { size: 11, gap: -4, border: 2, borderColor: '#ffffff', bg: 0, pad: 0, radius: 0, sepColor: '#fff', sepOpacity: 0.7 }
      },
      {
        name: '8. small, tight, subtle bg',
        style: { size: 5, gap: 1, border: 0.5, borderColor: '#ffffff', bg: 0.3, pad: 3, radius: 2, sepColor: '#fff', sepOpacity: 0.5 }
      },
      {
        name: '9. medium, frosted glass pill',
        style: { size: 8, gap: 2, border: 1, borderColor: 'rgba(255,255,255,0.5)', bg: 0.25, pad: 5, radius: 14, sepColor: '#fff', sepOpacity: 0.5 }
      },
      {
        name: '10. overlapping, drop shadow (no border)',
        style: { size: 10, gap: -3, border: 0, borderColor: '#fff', bg: 0, pad: 0, radius: 0, sepColor: '#fff', sepOpacity: 0.6, shadow: '0 1px 3px rgba(0,0,0,0.5)' }
      },
      {
        name: '11. white border, spaced, no bg',
        style: { size: 8, gap: 3, border: 1.5, borderColor: '#ffffff', bg: 0, pad: 0, radius: 0, sepColor: '#fff', sepOpacity: 0.7 }
      },
    ];

    function renderDots(combo, style) {
      const colors = { R: '#e74c3c', Y: '#f1c40f', B: '#3498db' };
      const totalSize = style.size + style.border * 2;
      const sepMargin = Math.max(style.gap, 1);

      const dotStyle = `width:${style.size}px;height:${style.size}px;border-radius:50%;`
        + `border:${style.border}px solid ${style.borderColor};`
        + (style.gap < 0 ? `margin-left:${style.gap}px;` : '')
        + (style.shadow ? `box-shadow:${style.shadow};` : '');

      const containerStyle = `display:flex;align-items:center;`
        + (style.gap >= 0 ? `gap:${style.gap}px;` : '')
        + (style.bg > 0 ? `background:rgba(0,0,0,${style.bg});padding:${style.pad}px ${style.pad + 2}px;border-radius:${style.radius}px;` : '');

      const hexToRgb = (hex) => {
        const r = parseInt(hex.slice(1,3),16);
        const g = parseInt(hex.slice(3,5),16);
        const b = parseInt(hex.slice(5,7),16);
        return `${r},${g},${b}`;
      };
      const sepStyle = `font-size:${Math.max(style.size * 0.7, 5)}px;line-height:1;`
        + `margin:0 ${sepMargin}px;`
        + `color:rgba(${hexToRgb(style.sepColor)},${style.sepOpacity});`;

      let html = `<div style="position:absolute;top:6px;right:6px;${containerStyle}">`;
      combo.left.forEach((c, i) => {
        const z = style.gap < 0 ? `position:relative;z-index:${combo.left.length - i};` : '';
        html += `<span style="${dotStyle}background:${colors[c]};${z}${i === 0 && style.gap < 0 ? 'margin-left:0;' : ''}"></span>`;
      });
      html += `<span style="${sepStyle}">\u2013</span>`;
      combo.right.forEach((c, i) => {
        const z = style.gap < 0 ? `position:relative;z-index:${combo.right.length - i};` : '';
        html += `<span style="${dotStyle}background:${colors[c]};${z}${i === 0 && style.gap < 0 ? 'margin-left:0;' : ''}"></span>`;
      });
      html += '</div>';
      return html;
    }

    // render variant cards
    const container = document.getElementById('variants');
    let html = '<h2>preset variations</h2><div class="variant-grid">';

    VARIANTS.forEach(v => {
      html += `<div class="variant-card">`;
      html += `<div class="variant-label">${v.name}</div>`;
      html += `<div class="variant-samples">`;
      COMBOS.slice(0, 4).forEach((combo, i) => {
        html += `<div class="sample-row">`;
        html += `<span class="sample-label">${combo.label}</span>`;
        html += `<div class="sample-img">`;
        html += `<img src="${IMAGES[i % IMAGES.length]}" alt="sample">`;
        html += renderDots(combo, v.style);
        html += `</div></div>`;
      });
      html += `</div></div>`;
    });
    html += '</div>';
    container.innerHTML = html;

    // playground
    const controls = {
      size: document.getElementById('c-size'),
      gap: document.getElementById('c-gap'),
      border: document.getElementById('c-border'),
      borderColor: document.getElementById('c-border-color'),
      bg: document.getElementById('c-bg'),
      pad: document.getElementById('c-pad'),
      radius: document.getElementById('c-radius'),
      red: document.getElementById('c-red'),
      yellow: document.getElementById('c-yellow'),
      blue: document.getElementById('c-blue'),
      sepColor: document.getElementById('c-sep-color'),
      sepOpacity: document.getElementById('c-sep-opacity'),
    };

    function getStyle() {
      return {
        size: parseFloat(controls.size.value),
        gap: parseFloat(controls.gap.value),
        border: parseFloat(controls.border.value),
        borderColor: controls.borderColor.value,
        bg: parseFloat(controls.bg.value),
        pad: parseFloat(controls.pad.value),
        radius: parseFloat(controls.radius.value),
        sepColor: controls.sepColor.value,
        sepOpacity: parseFloat(controls.sepOpacity.value),
      };
    }

    function updatePreview() {
      const style = getStyle();
      const area = document.getElementById('preview-area');

      // update value displays
      document.getElementById('v-size').textContent = style.size;
      document.getElementById('v-gap').textContent = style.gap;
      document.getElementById('v-border').textContent = style.border;
      document.getElementById('v-bg').textContent = style.bg;
      document.getElementById('v-pad').textContent = style.pad;
      document.getElementById('v-radius').textContent = style.radius;
      document.getElementById('v-sep-opacity').textContent = style.sepOpacity;

      let ph = '';
      COMBOS.forEach((combo, i) => {
        ph += `<div style="display:flex;align-items:center;gap:12px;">`;
        ph += `<span style="font-size:0.7rem;color:#999;width:90px;flex-shrink:0">${combo.label}</span>`;
        ph += `<div class="preview-card"><img src="${IMAGES[i % IMAGES.length]}" alt="sample">`;
        ph += renderDots(combo, style);
        ph += `</div></div>`;
      });
      area.innerHTML = ph;

      // css output
      const css = `.spring-dots {
  position: absolute;
  top: 6px;
  right: 6px;
  display: flex;
  align-items: center;${style.gap >= 0 ? `\n  gap: ${style.gap}px;` : ''}${style.bg > 0 ? `\n  background: rgba(0, 0, 0, ${style.bg});\n  padding: ${style.pad}px ${style.pad + 2}px;\n  border-radius: ${style.radius}px;` : ''}
}

.s-dot {
  width: ${style.size}px;
  height: ${style.size}px;
  border-radius: 50%;${style.border > 0 ? `\n  border: ${style.border}px solid ${style.borderColor};` : ''}${style.gap < 0 ? `\n  margin-left: ${style.gap}px;\n  position: relative;` : ''}
}
.s-dot:first-child { margin-left: 0; }

.s-dot-sep {
  font-size: ${Math.max(style.size * 0.7, 5).toFixed(1)}px;
  margin: 0 ${Math.max(style.gap, 1)}px;
  color: rgba(${hexToRgb(style.sepColor)}, ${style.sepOpacity});
}`;
      document.getElementById('css-output').textContent = css;
    }

    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `${r}, ${g}, ${b}`;
    }

    Object.values(controls).forEach(c => {
      c.addEventListener('input', updatePreview);
    });

    updatePreview();
  </script>
</body>
</html>
