<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spring dots — background treatments</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Times New Roman", Times, Georgia, serif;
      background: #f8f7f4;
      color: #000;
      padding: 40px 30px 80px;
      text-transform: lowercase;
    }
    h1 { font-size: 1.3rem; font-weight: 400; margin-bottom: 6px; }
    .subtitle { color: #666; font-size: 0.85rem; margin-bottom: 40px; }
    h2 { font-size: 0.95rem; font-weight: 400; margin-bottom: 16px; margin-top: 40px; }
    h2:first-of-type { margin-top: 0; }

    .variant-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 48px;
    }
    .variant-card {
      border: 1px solid #eee;
      border-radius: 4px;
      overflow: hidden;
    }
    .variant-label {
      padding: 10px 12px;
      font-size: 0.75rem;
      color: #666;
      border-bottom: 1px solid #eee;
    }
    .variant-samples {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .sample-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sample-label {
      font-size: 0.7rem;
      color: #999;
      width: 90px;
      flex-shrink: 0;
    }
    .sample-img {
      position: relative;
      width: 160px;
      height: 120px;
      border-radius: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .sample-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    a { color: #666; }
  </style>
</head>
<body>
  <h1>background treatments</h1>
  <p class="subtitle">same dot style (8px, 1.5px white border, 3px gap) — different backgrounds behind each group. <a href="index.html">back to dot styles</a></p>

  <div id="variants"></div>

  <script>
    const COMBOS = [
      { label: 'Y - R', left: ['Y'], right: ['R'] },
      { label: 'B - RY', left: ['B'], right: ['R','Y'] },
      { label: 'RY - 3R', left: ['R','Y'], right: ['R','R','R'] },
      { label: '2RY - 3RBY', left: ['R','R','Y'], right: ['R','R','R','B','Y'] },
    ];

    const IMAGES = [
      '../reformer-images/page008-img1.jpeg',
      '../reformer-images/page027-img1.jpeg',
      '../reformer-images/page055-img1.jpeg',
      '../reformer-images/page081-img1.jpeg',
    ];

    const DOT = { size: 8, gap: 3, border: 1.5, borderColor: '#fff' };

    const VARIANTS = [
      // current (no bg)
      { name: 'current — no background', bg: 'none' },

      // fully opaque solid colors
      { name: 'solid black', bg: 'rgba(0,0,0,1)', pad: '3px 5px', radius: '3px' },
      { name: 'solid white', bg: 'rgba(255,255,255,1)', pad: '3px 5px', radius: '3px', dotBorder: '#ccc' },
      { name: 'solid dark gray (#333)', bg: '#333', pad: '3px 5px', radius: '3px' },
      { name: 'solid medium gray (#777)', bg: '#777', pad: '3px 5px', radius: '3px' },
      { name: 'solid light gray (#ccc)', bg: '#ccc', pad: '3px 5px', radius: '3px' },
      { name: 'solid page color (#f8f7f4)', bg: '#f8f7f4', pad: '3px 5px', radius: '3px', dotBorder: '#ddd' },

      // fully opaque pills
      { name: 'solid black, pill', bg: 'rgba(0,0,0,1)', pad: '3px 6px', radius: '12px' },
      { name: 'solid white, pill', bg: 'rgba(255,255,255,1)', pad: '3px 6px', radius: '12px', dotBorder: '#ccc' },
      { name: 'solid dark gray, pill', bg: '#333', pad: '3px 6px', radius: '12px' },
      { name: 'solid medium gray, pill', bg: '#777', pad: '3px 6px', radius: '12px' },

      // semi-transparent
      { name: 'black 70%', bg: 'rgba(0,0,0,0.7)', pad: '3px 5px', radius: '3px' },
      { name: 'black 50%', bg: 'rgba(0,0,0,0.5)', pad: '3px 5px', radius: '3px' },
      { name: 'black 30%', bg: 'rgba(0,0,0,0.3)', pad: '3px 5px', radius: '3px' },
      { name: 'white 70%', bg: 'rgba(255,255,255,0.7)', pad: '3px 5px', radius: '3px', dotBorder: '#bbb' },
      { name: 'white 50%', bg: 'rgba(255,255,255,0.5)', pad: '3px 5px', radius: '3px', dotBorder: '#ccc' },
      { name: 'white 30%', bg: 'rgba(255,255,255,0.3)', pad: '3px 5px', radius: '3px' },

      // semi-transparent pills
      { name: 'black 70%, pill', bg: 'rgba(0,0,0,0.7)', pad: '3px 6px', radius: '12px' },
      { name: 'black 50%, pill', bg: 'rgba(0,0,0,0.5)', pad: '3px 6px', radius: '12px' },
      { name: 'white 70%, pill', bg: 'rgba(255,255,255,0.7)', pad: '3px 6px', radius: '12px', dotBorder: '#bbb' },
      { name: 'white 50%, pill', bg: 'rgba(255,255,255,0.5)', pad: '3px 6px', radius: '12px', dotBorder: '#ccc' },

      // frosted / blur
      { name: 'frosted glass (blur)', bg: 'rgba(0,0,0,0.25)', pad: '3px 5px', radius: '3px', blur: 4 },
      { name: 'frosted glass, pill', bg: 'rgba(0,0,0,0.25)', pad: '3px 6px', radius: '12px', blur: 4 },
      { name: 'frosted white, pill', bg: 'rgba(255,255,255,0.35)', pad: '3px 6px', radius: '12px', blur: 4, dotBorder: '#ccc' },

      // bigger padding
      { name: 'solid black, chunky pad', bg: '#000', pad: '5px 7px', radius: '4px' },
      { name: 'solid black, chunky pill', bg: '#000', pad: '5px 8px', radius: '14px' },
      { name: 'solid white, chunky pill', bg: '#fff', pad: '5px 8px', radius: '14px', dotBorder: '#ccc' },

      // border on the bg shape
      { name: 'transparent + black border', bg: 'transparent', pad: '3px 5px', radius: '3px', bgBorder: '1px solid rgba(0,0,0,0.4)' },
      { name: 'transparent + white border', bg: 'transparent', pad: '3px 5px', radius: '3px', bgBorder: '1px solid rgba(255,255,255,0.6)' },
      { name: 'white fill + border, pill', bg: 'rgba(255,255,255,0.85)', pad: '3px 6px', radius: '12px', bgBorder: '1px solid #ddd', dotBorder: '#ccc' },
      { name: 'black fill + white border, pill', bg: 'rgba(0,0,0,0.7)', pad: '3px 6px', radius: '12px', bgBorder: '1px solid rgba(255,255,255,0.3)' },

      // shadow on the bg
      { name: 'solid black + shadow', bg: '#000', pad: '3px 5px', radius: '3px', bgShadow: '0 1px 4px rgba(0,0,0,0.4)' },
      { name: 'solid black pill + shadow', bg: '#000', pad: '3px 6px', radius: '12px', bgShadow: '0 1px 4px rgba(0,0,0,0.4)' },
      { name: 'solid white pill + shadow', bg: '#fff', pad: '3px 6px', radius: '12px', bgShadow: '0 1px 4px rgba(0,0,0,0.15)', dotBorder: '#ccc' },
    ];

    const colors = { R: '#e74c3c', Y: '#f1c40f', B: '#3498db' };

    function renderDotGroup(springs, v, pos) {
      const border = v.dotBorder || DOT.borderColor;
      const dotStyle = `width:${DOT.size}px;height:${DOT.size}px;border-radius:50%;border:${DOT.border}px solid ${border};display:inline-block;`;

      let containerStyle = `position:absolute;top:6px;${pos === 'left' ? 'left:6px' : 'right:6px'};display:flex;align-items:center;gap:${DOT.gap}px;`;

      if (v.bg && v.bg !== 'none') {
        containerStyle += `background:${v.bg};padding:${v.pad || '3px 5px'};border-radius:${v.radius || '3px'};`;
      }
      if (v.blur) {
        containerStyle += `backdrop-filter:blur(${v.blur}px);-webkit-backdrop-filter:blur(${v.blur}px);`;
      }
      if (v.bgBorder) {
        containerStyle += `border:${v.bgBorder};`;
      }
      if (v.bgShadow) {
        containerStyle += `box-shadow:${v.bgShadow};`;
      }

      let html = `<div style="${containerStyle}">`;
      springs.forEach(c => {
        html += `<span style="${dotStyle}background:${colors[c]};"></span>`;
      });
      html += '</div>';
      return html;
    }

    const container = document.getElementById('variants');
    let html = '';

    VARIANTS.forEach(v => {
      html += `<div class="variant-card">`;
      html += `<div class="variant-label">${v.name}</div>`;
      html += `<div class="variant-samples">`;
      COMBOS.forEach((combo, i) => {
        html += `<div class="sample-row">`;
        html += `<span class="sample-label">${combo.label}</span>`;
        html += `<div class="sample-img">`;
        html += `<img src="${IMAGES[i % IMAGES.length]}" alt="sample">`;
        html += renderDotGroup(combo.left, v, 'left');
        html += renderDotGroup(combo.right, v, 'right');
        html += `</div></div>`;
      });
      html += `</div></div>`;
    });

    container.innerHTML = html;
  </script>
</body>
</html>
